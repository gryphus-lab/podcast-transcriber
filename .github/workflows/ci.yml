name: CI - Tests & SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550

      - name: Install dependencies
        run: mise run install
      - name: Run tests
        run: mise run test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    env:
      # Overridden by the resilient pull step below once a mirror succeeds.
      BASE_IMAGE: public.ecr.aws/docker/library/python:3.11-slim-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The official Python base image is rate-limited (HTTP 429 "Data limit
      # exceeded") independently on Docker Hub and the AWS ECR Public mirror, and
      # shared runners trip those caps. Pull from the first healthy mirror with
      # retries/backoff, re-tag to a stable local ref, and pass it to every build
      # via BASE_IMAGE so the actual `docker build` never pulls from a (possibly
      # throttled) registry.
      - name: Pull base image (resilient, multi-mirror)
        run: |
          set -u
          TAG="3.11-slim-trixie"
          LOCAL="python-base:ci"
          MIRRORS="
          public.ecr.aws/docker/library/python:${TAG}
          docker.io/library/python:${TAG}
          mirror.gcr.io/library/python:${TAG}
          "
          pulled=""
          for ref in $MIRRORS; do
            for attempt in 1 2 3; do
              echo "::group::pull $ref (attempt $attempt)"
              if docker pull "$ref"; then
                echo "::endgroup::"
                docker tag "$ref" "$LOCAL"
                pulled="$ref"
                break 2
              fi
              echo "::endgroup::"
              echo "pull failed for $ref (attempt $attempt); backing off..."
              sleep $((attempt * 10))
            done
          done
          if [ -z "$pulled" ]; then
            echo "::error::could not pull the Python base image from any mirror"; exit 1
          fi
          echo "Using base image $pulled (tagged $LOCAL)"
          echo "BASE_IMAGE=$LOCAL" >> "$GITHUB_ENV"

      - name: Build converter image
        run: docker build --build-arg BASE_IMAGE="$BASE_IMAGE" --target converter -t podcast-converter:ci .

      - name: Build transcriber image
        run: docker build --build-arg BASE_IMAGE="$BASE_IMAGE" --target transcriber -t podcast-transcriber:ci .

      # The converter is lightweight (no ML models), so we can fully boot it
      # and probe /health to catch import/startup regressions.
      - name: Smoke test converter service
        run: |
          docker run -d --name converter -p 8001:8001 podcast-converter:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8001/health; then
              echo "converter healthy"; ok=1; break
            fi
            echo "waiting for converter... ($i)"; sleep 2
          done
          docker logs converter
          docker rm -f converter
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::converter /health never became ready"; exit 1
          fi

      - name: Compose health check
        # No --pull always: the base image was already pulled + tagged locally as
        # $BASE_IMAGE by the resilient step; compose builds against it via the
        # BASE_IMAGE build arg. Pulling again would re-hit the throttled mirror.
        run: |
          docker compose up -d --build
          trap 'docker compose down --remove-orphans' EXIT
          for service in transcriber converter; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$([ "$service" = transcriber ] && echo 8000 || echo 8001)/health"; then
                echo "$service healthy"
                ok=1
                break
              fi
              echo "waiting for $service... ($i)"
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              docker compose ps
              docker compose logs "$service"
              echo "::error::$service /health never became ready"
              exit 1
            fi
          done

      # at import time, which is slow and fragile in CI. Rather than importing
      # the app, verify the package is installed and its console entrypoints
      # resolve - this catches packaging / ModuleNotFoundError regressions
      # without executing the ML import chain.
      - name: Smoke test transcriber packaging
        run: |
          docker run --rm --entrypoint python podcast-transcriber:ci -c "
          import importlib.util, importlib.metadata, sys
          # Package and its submodules must be importable as files.
          for mod in (
              'podcast_transcriber',
              'podcast_transcriber.api',
              'podcast_transcriber.converter_service',
          ):
              if importlib.util.find_spec(mod) is None:
                  sys.exit(f'missing module: {mod}')
          # Console entrypoints declared in pyproject must be registered.
          scripts = {ep.name for ep in importlib.metadata.entry_points(group='console_scripts')}
          for name in ('transcribe', 'transcribe-api'):
              if name not in scripts:
                  sys.exit(f'missing console script: {name}')
          print('transcriber packaging OK')
          "
