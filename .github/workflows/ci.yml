name: CI - Tests & SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca

      - name: Install dependencies
        run: mise run install
      - name: Run tests
        run: mise run test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build converter image
        run: docker build --target converter -t podcast-converter:ci .

      - name: Build transcriber image
        run: docker build --target transcriber -t podcast-transcriber:ci .

      # The converter is lightweight (no ML models), so we can fully boot it
      # and probe /health to catch import/startup regressions.
      - name: Smoke test converter service
        run: |
          docker run -d --name converter -p 8001:8001 podcast-converter:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8001/health; then
              echo "converter healthy"; ok=1; break
            fi
            echo "waiting for converter... ($i)"; sleep 2
          done
          docker logs converter
          docker rm -f converter
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::converter /health never became ready"; exit 1
          fi

      - name: Compose health check
        run: |
          docker compose up -d --pull always
          trap 'docker compose down --remove-orphans' EXIT
          for service in transcriber converter; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$([ "$service" = transcriber ] && echo 8000 || echo 8001)/health"; then
                echo "$service healthy"
                ok=1
                break
              fi
              echo "waiting for $service... ($i)"
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              docker compose ps
              docker compose logs "$service"
              echo "::error::$service /health never became ready"
              exit 1
            fi
          done

      # at import time, which is slow and fragile in CI. Rather than importing
      # the app, verify the package is installed and its console entrypoints
      # resolve - this catches packaging / ModuleNotFoundError regressions
      # without executing the ML import chain.
      - name: Smoke test transcriber packaging
        run: |
          docker run --rm --entrypoint python podcast-transcriber:ci -c "
          import importlib.util, importlib.metadata, sys
          # Package and its submodules must be importable as files.
          for mod in (
              'podcast_transcriber',
              'podcast_transcriber.api',
              'podcast_transcriber.converter_service',
          ):
              if importlib.util.find_spec(mod) is None:
                  sys.exit(f'missing module: {mod}')
          # Console entrypoints declared in pyproject must be registered.
          scripts = {ep.name for ep in importlib.metadata.entry_points(group='console_scripts')}
          for name in ('transcribe', 'transcribe-api'):
              if name not in scripts:
                  sys.exit(f'missing console script: {name}')
          print('transcriber packaging OK')
          "
