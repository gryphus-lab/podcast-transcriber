name: CI - Tests & SonarQube Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d

      - name: Install dependencies
        run: mise run install
      - name: Run tests
        run: mise run test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build converter image
        run: docker build --target converter -t podcast-converter:ci .

      - name: Build transcriber image
        run: docker build --target transcriber -t podcast-transcriber:ci .

      # The converter is lightweight (no ML models), so we can fully boot it
      # and probe /health to catch import/startup regressions.
      - name: Smoke test converter service
        run: |
          docker run -d --name converter -p 8001:8001 podcast-converter:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8001/health; then
              echo "converter healthy"; ok=1; break
            fi
            echo "waiting for converter... ($i)"; sleep 2
          done
          docker logs converter
          docker rm -f converter
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::converter /health never became ready"; exit 1
          fi

      # The transcriber image loads heavy ML deps at startup, so instead of a
      # full boot we verify the app module imports cleanly inside the image -
      # this catches ModuleNotFoundError / packaging regressions quickly.
      - name: Smoke test transcriber imports
        run: |
          docker run --rm --entrypoint python podcast-transcriber:ci \
            -c "import podcast_transcriber.api; import podcast_transcriber.converter_service; print('transcriber imports OK')"
