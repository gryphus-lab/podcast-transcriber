services:
  transcriber:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: transcriber
      args:
        BASE_IMAGE: ${BASE_IMAGE:-public.ecr.aws/docker/library/python:3.11-slim-trixie}
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - LANGUAGE=${LANGUAGE:-en}
      - OUTPUT_DIR=/app/output
      - JOBS_DIR=/app/jobs
      # Async job backend: 'memory' (default) or 'rq'. The rq profile below
      # provides Redis + a worker; set JOB_BACKEND=rq to use them.
      - JOB_BACKEND=${JOB_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Run each transcription in an isolated child process so an out-of-memory
      # kill fails only that job (the API survives) instead of killing the
      # container and losing in-memory jobs. Set to 0 to run in-thread.
      - ISOLATE_TRANSCRIPTION=${ISOLATE_TRANSCRIPTION:-1}
      # Cap native threads to curb per-thread allocator growth (peak RSS).
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      # CPU-tuned Whisper decode batch (lower = less peak memory).
      - WHISPER_BATCH_SIZE=${WHISPER_BATCH_SIZE:-8}
      # Hard wall-clock ceiling (seconds) for a single transcription. Guarantees
      # a job reaches a terminal state even when a VM-wide OOM kills the worker
      # without the parent seeing a clean BrokenProcessPool (which otherwise
      # leaves the job stuck 'running' while the pool respawns and re-thrashes).
      - TRANSCRIPTION_TIMEOUT=${TRANSCRIPTION_TIMEOUT:-3600}
    volumes:
      - transcriber-output:/app/output
      - transcriber-jobs:/app/jobs
    deploy:
      resources:
        limits:
          # IMPORTANT: this limit must be <= the Docker Desktop VM's total RAM
          # (Settings -> Resources -> Memory). A limit LARGER than the VM is a
          # phantom: Docker can't grant more than the VM has, so the kernel
          # ignores it and the OOM-killer runs VM-wide and non-deterministically
          # - which can kill the worker in a way the parent never observes,
          # hanging the job. Keeping it at/under the VM size makes OOM
          # cgroup-scoped, so the app fails the job cleanly instead.
          #
          # Diarized long audio ('large-v3' + pyannote) peaks ~7.5-12 GB, which
          # a default 8 GiB VM cannot satisfy. For long files prefer the NATIVE
          # 'transcribe' CLI on the host (full machine RAM, no VM ceiling - see
          # README "Transcribing long files"); Docker is best for the API and
          # short/medium clips. To push large files through Docker, raise BOTH
          # the VM memory AND this limit together (e.g. 12G VM + 12G here).
          memory: ${TRANSCRIBER_MEMORY_LIMIT:-7G}

  converter:
    restart: unless-stopped
    # No depends_on the transcriber: the converter is an independent service
    # (standalone audio-format conversion on :8001) and never calls the
    # transcriber. Coupling its startup to the transcriber's slow ML-stack boot
    # via `condition: service_healthy` made `docker compose up` abort before the
    # transcriber could finish loading.
    build:
      context: .
      dockerfile: Dockerfile
      target: converter
      args:
        BASE_IMAGE: ${BASE_IMAGE:-public.ecr.aws/docker/library/python:3.11-slim-trixie}
    ports:
      - "8001:8001"
    environment:
      - OUTPUT_DIR=/app/output
    volumes:
      - converter-output:/app/output

  # ---- Durable async job backend (optional) -----------------------------
  # Enabled with the `rq` profile:  docker compose --profile rq up --build
  # Start the stack with JOB_BACKEND=rq so the transcriber enqueues to Redis.
  redis:
    image: redis:7-alpine
    profiles: ["rq"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rq-worker:
    profiles: ["rq"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: transcriber
      args:
        BASE_IMAGE: ${BASE_IMAGE:-public.ecr.aws/docker/library/python:3.11-slim-trixie}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - LANGUAGE=${LANGUAGE:-en}
      - OUTPUT_DIR=/app/output
      - JOBS_DIR=/app/jobs
      - JOB_BACKEND=rq
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Share the staged inputs + outputs with the API so the worker can read
      # uploads and the API can serve the transcripts it writes.
      - transcriber-output:/app/output
      - transcriber-jobs:/app/jobs
    # The base image doesn't bake the optional rq extra; uv adds it at launch.
    command:
      [
        "uv",
        "run",
        "--extra",
        "rq",
        "rq",
        "worker",
        "--url",
        "redis://redis:6379/0",
        "transcriptions",
      ]
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  transcriber-output:
  transcriber-jobs:
  converter-output:
