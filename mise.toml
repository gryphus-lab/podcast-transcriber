[tools]
python = "3.11"
uv = 'latest'
prettier = 'latest'

# Automatic virtual environment
[env]
_.python.venv = { path = ".venv", create = true }
PROJECT_NAME = "{{ config_root | basename }}"
VIRTUAL_ENV = "{{ config_root }}/.venv"
PATH = "{{ config_root }}/.venv/bin:{{env.PATH}}"

[settings]
activate_aggressive = true

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Python: $(python --version)"
'''

[tasks.lint]
description = "Lint and check formatting with Ruff and Prettier"
run = "uv run ruff check . && uv run ruff format --check . && prettier --check ."

[tasks.format]
description = "Format and fix code with Ruff and Prettier"
run = "uv run ruff format . && uv run ruff check --fix . && prettier --write ."

[tasks.bootstrap]
description = "Install dependencies using uv (incl. the rq extra so the full test suite runs)"
run = "uv sync --extra rq"

[tasks.transcribe]
description = "Transcribe an audio file (CLI)"
run = "uv run transcribe {args}"

[tasks.api]
description = "Start the transcription API server"
run = "uv run transcribe-api"

[tasks.docker-up]
description = "Start both services via Docker Compose"
run = "docker compose --compatibility up --build -d"

[tasks.docker-down]
description = "Stop Docker services"
run = "docker compose down"

[tasks.add]
description = "Add a new dependency"
run = "uv add {args}"

[tasks.update]
description = "Update dependencies"
run = "uv sync --upgrade"

[tasks.version-check]
description = "Fail if the semantic version drifts across project files"
run = "uv run python scripts/check_version.py"

[tasks.version-patch]
description = "Increase the patch version"
run = "uv run python scripts/bump_version.py patch"

[tasks.version-minor]
description = "Increase the minor version"
run = "uv run python scripts/bump_version.py minor"

[tasks.version-major]
description = "Increase the major version"
run = "uv run python scripts/bump_version.py major"

[tasks.install-hooks]
description = "Configure Git to use the repository hooks"
run = "git config core.hooksPath .githooks"

[tasks.test]
description = "Run tests"
run = ["uv run python scripts/check_version.py", "uv run pytest"]
